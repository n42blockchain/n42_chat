name: n42_chat
publish_to: none
description: >
  A Matrix-based chat module with WeChat-style UI for N42 Wallet integration.
  可独立运行或作为package嵌入其他Flutter应用的聊天模块。
version: 0.1.0
homepage: https://github.com/n42/n42_chat
repository: https://github.com/n42/n42_chat
issue_tracker: https://github.com/n42/n42_chat/issues

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: ">=3.44.8"

dependencies:
  async: ^2.13.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ============================================
  # Matrix Protocol - 核心通信协议
  # ============================================
  # Apache 2.0 License - 商业友好
  # Matrix 13: vodozemac encryption backend and MatrixSdkDatabase
  matrix: ^13.0.0
  # End-to-End Encryption - vodozemac 加密后端（替代 flutter_olm）
  flutter_rust_bridge: 2.13.0
  flutter_vodozemac: ^0.8.1

  # ============================================
  # State Management - 状态管理
  # ============================================
  # MIT License
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # ============================================
  # Dependency Injection - 依赖注入
  # ============================================
  # MIT License
  get_it: ^9.2.1
  injectable: ^3.0.0

  # ============================================
  # Routing - 路由管理
  # ============================================
  # BSD-3-Clause License
  go_router: ^18.0.1

  # ============================================
  # Local Storage - 本地存储
  # ============================================
  # MIT License
  drift: ^2.35.0
  # Encrypt archive.db because it indexes decrypted E2EE plaintext. SQLCipher
  # remains compatible with the Matrix SDK's unkeyed SQLite databases.
  sqlite3: ^3.6.0
  sqflite: ^2.4.3
  # BSD-3-Clause License
  flutter_secure_storage:
    git:
      url: https://github.com/n42blockchain/n42appv2.git
      ref: 9733aa21eb7e4fa98c2aa8a287ef9588960023c2
      path: packages/flutter_secure_storage
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # ============================================
  # Device Features - 设备功能
  # ============================================
  # MIT License
  flutter_contacts: ^2.0.2

  # ============================================
  # Network - 网络请求
  # ============================================
  # MIT License
  dio: ^5.9.2
  http: ^1.3.0
  connectivity_plus: ^7.0.0

  # ============================================
  # UI Components - UI组件
  # ============================================
  # MIT License
  cached_network_image: ^4.0.2
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.3

  # ============================================
  # Image & Media - 图片和媒体
  # ============================================
  # Apache 2.0 / MIT License
  image_picker: ^1.2.1
  photo_manager: ^3.12.0
  photo_view: ^0.15.0
  video_player: ^2.13.0
  video_thumbnail: ^0.5.3
  audioplayers: ^6.6.0
  record: ^6.0.0
  chewie: ^1.13.1
  file_picker: ^13.1.0
  permission_handler: ^13.0.2
  saver_gallery: ^4.1.0
  share_plus: ^13.3.0
  pro_image_editor: ^14.4.1
  material_ui: ^1.1.1

  # ============================================
  # Utils - 工具库
  # ============================================
  # MIT / BSD-3-Clause License
  equatable: ^3.0.0
  # MIME 类型检测
  mime: ^2.0.0
  json_annotation: ^4.8.1
  intl: ^0.20.2
  uuid: ^4.5.3
  collection: ^1.18.0
  rxdart: ^0.28.0
  logger: ^2.7.0
  # Cryptography - 加密工具
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  
  # ============================================
  # UI Helpers
  # ============================================
  flutter_svg: ^2.2.4
  lottie: ^3.1.2
  flutter_highlight: ^0.7.0
  badges: ^3.1.2
  pinyin: ^3.0.0
  qr_flutter: ^4.1.0
  flutter_markdown: ^0.7.4+3
  markdown: ^7.3.0
  unorm_dart: ^0.2.0

  # ============================================
  # ML Kit - 机器学习
  # ============================================
  # Apache 2.0 License - 人脸检测（自动模糊）
  google_mlkit_face_detection: ^0.15.1
  # On-device structured OCR and image-text translation.
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_translation: ^0.15.1
  # Apache 2.0 License - 人像分割（通话虚拟背景 / 背景模糊）
  google_mlkit_selfie_segmentation: ^0.12.1
  # image codec - 图片编解码
  image: ^4.8.0

  # ============================================
  # Text-to-Speech - 消息朗读
  # ============================================
  flutter_tts: ^4.2.0

  # ============================================
  # PDF Viewer - PDF 预览
  # ============================================
  pdfx: ^2.9.0
  
  # ============================================
  # Location & Maps - 位置服务与地图
  # ============================================
  # MIT License
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  # BSD License - OpenStreetMap 地图组件
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # ============================================
  # URL Launcher - 启动外部应用
  # ============================================
  # BSD-3-Clause License
  url_launcher: ^6.3.2

  # ============================================
  # WebView - Mini App 框架
  # ============================================
  # BSD-3-Clause License
  webview_flutter: ^4.13.1
  
  # ============================================
  # QR Code Scanner - 二维码扫描
  # ============================================
  # BSD-3-Clause License
  mobile_scanner: ^7.2.0
  
  # ============================================
  # VoIP & WebRTC - 音视频通话
  # ============================================
  # MIT License
  flutter_webrtc: ^1.2.1
  # LiveKit 多人会议 - 需要解决 pointycastle 版本冲突后启用
  livekit_client: ^2.6.0
  # 屏幕共享前台服务（Android mediaProjection，T8）
  flutter_background: ^1.3.1
  
  # ============================================
  # Push Notifications & Call Kit - 来电推送
  # ============================================
  # MIT License
  flutter_callkit_incoming: ^3.1.6
  firebase_core: ^4.5.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.2.0
  # 系统级集成：动态快捷方式（Android Shortcuts / iOS Quick Actions）
  quick_actions: ^1.1.0
  # 系统级集成：应用角标未读数（桌面 任务栏/Dock + 移动端图标角标）
  app_badge_plus: ^1.3.1
  # 端侧 AI 推理：Gemma on-device（MediaPipe LLM Inference）。模型为运行时下载，
  # 不打进包体；未下载/不支持时 LocalLlmService 恒 unavailable 回退云端。
  flutter_gemma: ^0.12.6
  
  # ============================================
  # Wakelock - 保持屏幕常亮
  # ============================================
  wakelock_plus: ^1.5.1
  
  # ============================================
  # Auth - 认证相关
  # ============================================
  # Passkey / WebAuthn - 需要时启用
  # passkeys: ^2.0.5  # 需要配置 RP ID 和 Origin
  # 第三方登录
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  flutter_facebook_auth: ^7.1.1  # Facebook 登录
  twitter_login: ^4.4.2  # Twitter 登录
  fluwx: ^5.0.0  # 微信 SDK（登录、分享等）
  # OTP 输入框
  pinput: ^6.0.2
  # 生物识别 - 面部/指纹登录
  local_auth: ^3.0.1

  flutter_cache_manager: ^3.4.1

dependency_overrides:
  # Resolve transitive hosted constraints to the same reviewed Git source.
  flutter_secure_storage:
    git:
      url: https://github.com/n42blockchain/n42appv2.git
      ref: 9733aa21eb7e4fa98c2aa8a287ef9588960023c2
      path: packages/flutter_secure_storage
  # The maintained desktop plugin supports the reviewed secure-storage 11 source.
  facebook_auth_desktop:
    git:
      url: https://github.com/n42blockchain/n42appv2.git
      ref: 9733aa21eb7e4fa98c2aa8a287ef9588960023c2
      path: packages/facebook_auth_desktop

dev_dependencies:
  vodozemac: ^0.8.0
  image_picker_platform_interface: ^2.11.1
  shared_preferences_platform_interface: ^2.4.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  injectable_generator: ^3.1.3
  drift_dev: ^2.35.0
  mockito: ^5.8.1
  mocktail: ^1.0.3
  path_provider_platform_interface: ^2.1.2
  bloc_test: ^10.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/stickers/openmoji/
    - assets/stickers/lottie/

# Standalone Chat tests/builds must load SQLCipher, never system plaintext SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
