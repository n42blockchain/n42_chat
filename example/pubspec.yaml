name: n42_chat_example
description: Example app demonstrating N42 Chat integration.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 引用父目录的n42_chat包
  n42_chat:
    path: ../

  # Matrix SDK for server testing
  matrix: ^13.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.1

  cupertino_icons: ^1.0.6

dependency_overrides:
  flutter_secure_storage:
    git:
      url: https://github.com/n42blockchain/n42appv2.git
      ref: 9733aa21eb7e4fa98c2aa8a287ef9588960023c2
      path: packages/flutter_secure_storage
  facebook_auth_desktop:
    git:
      url: https://github.com/n42blockchain/n42appv2.git
      ref: 9733aa21eb7e4fa98c2aa8a287ef9588960023c2
      path: packages/facebook_auth_desktop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
