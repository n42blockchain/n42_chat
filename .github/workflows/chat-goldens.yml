name: Chat golden regression

on:
  push:
    paths:
      - '.github/workflows/chat-goldens.yml'
      - 'test/goldens/**'
      - 'lib/src/core/theme/**'
      - 'lib/src/presentation/widgets/chat/**'
      - 'lib/src/presentation/pages/conversation/conversation_tile.dart'
  pull_request:
    paths:
      - '.github/workflows/chat-goldens.yml'
      - 'test/goldens/**'
      - 'lib/src/core/theme/**'
      - 'lib/src/presentation/widgets/chat/**'
      - 'lib/src/presentation/pages/conversation/conversation_tile.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goldens:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - name: Compare exact golden pixels
        run: flutter test test/goldens/chat_core_golden_test.dart --no-pub --reporter expanded
      - name: Preserve golden failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-golden-failures-${{ runner.os }}
          path: test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 7
